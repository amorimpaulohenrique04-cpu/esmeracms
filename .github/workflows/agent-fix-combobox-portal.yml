name: Apply combobox dialog fix

on:
  push:
    branches:
      - agent/create-dialogs-responsive-20260806

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-dialogs-responsive-20260806
          fetch-depth: 0

      - name: Apply focused fix
        run: |
          python scripts/agent_fix_combobox_portal.py
          git diff --check

      - name: Commit fix
        run: |
          rm scripts/agent_fix_combobox_portal.py
          rm .github/workflows/agent-fix-combobox-portal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sales): keep customer combobox inside dialog"
          git push origin HEAD:agent/create-dialogs-responsive-20260806
