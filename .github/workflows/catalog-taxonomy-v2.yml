name: Validate Catalog Taxonomy V2

on:
  push:
    branches: [agent/catalog-taxonomy-v2-20260806]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esmera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esmera
      PAYLOAD_SECRET: ci-only-payload-secret-change-me
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply compatibility patches
        run: |
          node scripts/apply-catalog-v2-patches.mjs
          node scripts/apply-catalog-v2-query-fixes.mjs
      - run: pnpm generate:types
      - run: pnpm generate:importmap
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings=0
      - run: pnpm test:int
      - run: pnpm build
      - name: Commit generated and patched files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json src
            git commit -m "chore(catalog): apply generated V2 compatibility updates"
            git push origin HEAD:agent/catalog-taxonomy-v2-20260806
          fi
      - name: Prepare workspace artifact
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/catalog-taxonomy-workspace.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-taxonomy-workspace
          path: /tmp/catalog-taxonomy-workspace.tgz
          retention-days: 2
