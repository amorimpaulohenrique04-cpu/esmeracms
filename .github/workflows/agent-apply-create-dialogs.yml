name: Apply create dialogs patch

on:
  push:
    branches:
      - agent/create-dialogs-responsive-20260806

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-dialogs-responsive-20260806
          fetch-depth: 0

      - name: Validate patch scripts
        run: python -m py_compile scripts/agent_patch_backend.py scripts/agent_patch_frontend.py scripts/agent_patch_quality.py

      - name: Apply implementation
        run: |
          python scripts/agent_patch_backend.py
          python scripts/agent_patch_frontend.py
          python scripts/agent_patch_quality.py
          git diff --check

      - name: Commit implementation
        run: |
          rm scripts/agent_patch_backend.py scripts/agent_patch_frontend.py scripts/agent_patch_quality.py
          rm .github/workflows/agent-apply-create-dialogs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(admin): add sale and category creation dialogs"
          git push origin HEAD:agent/create-dialogs-responsive-20260806
