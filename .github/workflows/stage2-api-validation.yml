name: Stage 2 - Validate production Payload API

on:
  push:
    branches:
      - agent/payload-home-contract-stage-1
    paths:
      - .github/workflows/stage2-api-validation.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage2-api-validation.yml

permissions:
  contents: read

jobs:
  validate-production-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public and private API contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          ;(async () => {
            const baseURL = 'https://esmeracms-green.vercel.app'
            const publicEndpoints = [
              '/api/products?limit=1&depth=2',
              '/api/categories?limit=1&depth=2',
              '/api/media?limit=1',
              '/api/globals/home?depth=2',
              '/api/globals/navigation?depth=2',
              '/api/globals/site-settings?depth=2',
              '/api/globals/about?depth=2',
              '/api/globals/contact?depth=2',
              '/api/globals/collection-page?depth=2',
            ]
            const privateEndpoints = [
              '/api/customers?limit=1',
              '/api/users?limit=1',
              '/api/sales?limit=1',
              '/api/after-sales?limit=1',
            ]

            async function inspect(path, visibility) {
              const startedAt = Date.now()
              const result = { path, visibility }
              try {
                const response = await fetch(`${baseURL}${path}`, {
                  headers: {
                    accept: 'application/json',
                    'user-agent': 'esmera-stage2-api-validator/1.0',
                  },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(20000),
                })
                const contentType = response.headers.get('content-type') || ''
                const text = await response.text()
                let parsed = null
                let validJSON = false
                try {
                  parsed = JSON.parse(text)
                  validJSON = true
                } catch {}

                result.status = response.status
                result.contentType = contentType
                result.validJSON = validJSON
                result.durationMs = Date.now() - startedAt
                result.topLevelKeys = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
                  ? Object.keys(parsed).slice(0, 16)
                  : []
                result.totalDocs = parsed && typeof parsed === 'object' ? parsed.totalDocs ?? null : null
                result.documentStatus = parsed && typeof parsed === 'object' ? parsed._status ?? null : null
                result.message = parsed && typeof parsed === 'object' && typeof parsed.message === 'string'
                  ? parsed.message.slice(0, 160)
                  : null
              } catch (error) {
                result.error = error instanceof Error ? `${error.name}: ${error.message}` : String(error)
                result.durationMs = Date.now() - startedAt
              }
              return result
            }

            const results = []
            for (const endpoint of publicEndpoints) results.push(await inspect(endpoint, 'public'))
            for (const endpoint of privateEndpoints) results.push(await inspect(endpoint, 'private'))

            const publicFailures = results.filter((item) =>
              item.visibility === 'public' &&
              (item.status !== 200 || item.validJSON !== true || !String(item.contentType || '').includes('application/json'))
            )
            const privateFailures = results.filter((item) =>
              item.visibility === 'private' && item.status === 200
            )

            const report = {
              checkedAt: new Date().toISOString(),
              baseURL,
              passed: publicFailures.length === 0 && privateFailures.length === 0,
              summary: {
                publicChecked: publicEndpoints.length,
                publicFailures: publicFailures.length,
                privateChecked: privateEndpoints.length,
                privateFailures: privateFailures.length,
              },
              results,
            }

            fs.writeFileSync('stage2-api-validation.json', JSON.stringify(report, null, 2))
            console.log(JSON.stringify(report, null, 2))

            if (!report.passed) process.exitCode = 1
          })().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-api-validation
          path: stage2-api-validation.json
          retention-days: 14
