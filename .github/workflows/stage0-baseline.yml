name: Stage 0 - Security and Baseline

on:
  push:
    branches:
      - main
      - feat/admin-operational-rebuild
      - agent/etapas-20-22-quality-gates
  pull_request:
    branches:
      - main
      - feat/admin-operational-rebuild
      - agent/etapas-20-22-quality-gates
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: stage0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esmera_stage0
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d esmera_stage0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esmera_stage0
      PAYLOAD_SECRET: stage0-ci-only-secret-change-before-production-2026
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release gate
        run: pnpm validate:release

      - name: Package approved production build
        run: tar -czf /tmp/stage0-next-build.tgz .next

      - name: Upload approved production build
        uses: actions/upload-artifact@v4
        with:
          name: stage0-next-build-${{ github.run_id }}
          path: /tmp/stage0-next-build.tgz
          if-no-files-found: error
          retention-days: 1

  visual-baseline:
    name: Visual baseline
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esmera_stage0
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d esmera_stage0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esmera_stage0
      PAYLOAD_SECRET: stage0-ci-only-secret-change-before-production-2026
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BASELINE_BASE_URL: http://localhost:3000
      BASELINE_ADMIN_EMAIL: baseline.admin@esmera.local
      BASELINE_ADMIN_PASSWORD: EsmeraBaseline-2026!
      VISUAL_DATASET_VERSION: stage23-v2
      VISUAL_REFERENCE_DIR: artifacts/reference-baseline
      VISUAL_CURRENT_DIR: artifacts/admin-baseline
      VISUAL_REPORT_PATH: artifacts/visual-regression-report.json
      VISUAL_REPORT_HTML_PATH: artifacts/visual-regression-report.html
      VISUAL_DIFF_DIR: artifacts/visual-diffs
      VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download approved production build
        uses: actions/download-artifact@v4
        with:
          name: stage0-next-build-${{ github.run_id }}
          path: /tmp/stage0-build

      - name: Restore approved production build
        run: tar -xzf /tmp/stage0-build/stage0-next-build.tgz

      - name: Capture complete deterministic admin baseline
        id: capture
        run: pnpm baseline:capture

      - name: Validate current baseline manifest
        if: steps.capture.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'artifacts/admin-baseline/baseline-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (manifest.schemaVersion !== 2 || manifest.complete !== true) throw new Error('Current baseline manifest is not complete.')
          if (manifest.actualPngs !== manifest.expectedPngs) throw new Error(`Current baseline is incomplete: ${manifest.actualPngs}/${manifest.expectedPngs}`)
          if (!Array.isArray(manifest.files) || manifest.files.length !== manifest.actualPngs) throw new Error('Current baseline hashes are incomplete.')
          console.log(`Current baseline validated: ${manifest.actualPngs}/${manifest.expectedPngs} PNGs.`)
          NODE

      - name: Resolve exact visual reference for base SHA
        if: steps.capture.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf artifacts/reference-baseline
          mkdir -p artifacts/reference-baseline

          FOUND=false
          SEARCHED_BRANCHES=""

          for REFERENCE_BRANCH in "${BASE_BRANCH}" "${HEAD_BRANCH}"; do
            if [ -z "${REFERENCE_BRANCH}" ] || [[ " ${SEARCHED_BRANCHES} " == *" ${REFERENCE_BRANCH} "* ]]; then
              continue
            fi
            SEARCHED_BRANCHES="${SEARCHED_BRANCHES} ${REFERENCE_BRANCH}"

            RUN_IDS=$(gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/stage0-baseline.yml/runs" \
              -f branch="${REFERENCE_BRANCH}" \
              -f status="success" \
              -f per_page=40 \
              --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id')

            for RUN_ID in ${RUN_IDS}; do
              ARTIFACT_ID=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name | startswith("admin-baseline-")))][0].id // empty')

              if [ -z "${ARTIFACT_ID}" ]; then
                continue
              fi

              rm -rf /tmp/esmera-reference-candidate /tmp/esmera-reference.zip
              mkdir -p /tmp/esmera-reference-candidate
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/esmera-reference.zip
              unzip -q /tmp/esmera-reference.zip -d /tmp/esmera-reference-candidate

              if node - /tmp/esmera-reference-candidate/baseline-manifest.json <<'NODE'
          const fs = require('fs')
          const file = process.argv[2]
          if (!fs.existsSync(file)) process.exit(1)
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
          const valid = manifest.schemaVersion === 2
            && manifest.datasetVersion === process.env.VISUAL_DATASET_VERSION
            && manifest.complete === true
            && manifest.actualPngs === manifest.expectedPngs
            && Array.isArray(manifest.files)
            && manifest.files.length === manifest.actualPngs
            && manifest.commitSha === process.env.VISUAL_BASE_SHA
          process.exit(valid ? 0 : 1)
          NODE
              then
                cp -a /tmp/esmera-reference-candidate/. artifacts/reference-baseline/
                echo "Exact reference ${ARTIFACT_ID} loaded from run ${RUN_ID} on ${REFERENCE_BRANCH} for base ${VISUAL_BASE_SHA}."
                FOUND=true
                break 2
              fi
            done
          done

          if [ "${FOUND}" != "true" ]; then
            echo "No approved reference exists for exact base ${VISUAL_BASE_SHA}; capturing the base commit deterministically in an isolated database."
            BASE_WORKTREE=/tmp/esmera-visual-base
            BASE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/esmera_stage0_base
            rm -rf "${BASE_WORKTREE}"
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS esmera_stage0_base WITH (FORCE);'
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE esmera_stage0_base;'
            git worktree add --detach "${BASE_WORKTREE}" "${VISUAL_BASE_SHA}"
            (
              cd "${BASE_WORKTREE}"
              export DATABASE_URL="${BASE_DATABASE_URL}"
              export GITHUB_SHA="${VISUAL_BASE_SHA}"
              pnpm install --frozen-lockfile
              timeout 8m pnpm build
              timeout 10m pnpm baseline:capture
            )
            cp -a "${BASE_WORKTREE}/artifacts/admin-baseline/." artifacts/reference-baseline/
            git worktree remove --force "${BASE_WORKTREE}"

            node <<'NODE'
          const fs = require('fs')
          const file = 'artifacts/reference-baseline/baseline-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (manifest.schemaVersion !== 2 || manifest.complete !== true) throw new Error('Generated base reference is incomplete.')
          if (manifest.commitSha !== process.env.VISUAL_BASE_SHA) throw new Error(`Generated reference SHA ${manifest.commitSha} does not match base ${process.env.VISUAL_BASE_SHA}.`)
          if (manifest.datasetVersion !== process.env.VISUAL_DATASET_VERSION) throw new Error('Generated base reference uses a different dataset version.')
          if (manifest.actualPngs !== manifest.expectedPngs || manifest.files.length !== manifest.actualPngs) throw new Error('Generated base reference has incomplete captures or hashes.')
          console.log(`Exact base reference generated: ${manifest.actualPngs}/${manifest.expectedPngs} PNGs for ${manifest.commitSha}.`)
          NODE
          fi

      - name: Compare visual regression
        id: compare
        if: steps.capture.outcome == 'success'
        run: pnpm baseline:compare

      - name: Assert visual reports exist
        if: always() && steps.capture.outcome == 'success'
        run: |
          test -s artifacts/visual-regression-report.json
          test -s artifacts/visual-regression-report.html

      - name: Upload approved admin baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-baseline-${{ github.run_id }}
          path: artifacts/admin-baseline/
          if-no-files-found: error
          retention-days: 90

      - name: Upload visual regression report
        if: always() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            artifacts/visual-regression-report.json
            artifacts/visual-regression-report.html
            artifacts/visual-diffs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload visual capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture-diagnostics-${{ github.run_id }}
          path: |
            artifacts/admin-baseline/
            artifacts/visual-regression-report.json
            artifacts/visual-regression-report.html
            artifacts/visual-diffs/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
