name: Investigate production media

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Payload media and rendered Deco image URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          PAYLOAD = "https://esmeracms-green.vercel.app"
          FRONTEND = "https://envs-testeesmera--vdcji85.decocdn.com"
          UA = "EsmeraMediaDiagnostic/1.0"

          def request(url, *, accept="*/*", referer=None, range_byte=False):
              headers = {"Accept": accept, "User-Agent": UA}
              if referer:
                  headers["Referer"] = referer
              if range_byte:
                  headers["Range"] = "bytes=0-0"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return {
                          "status": response.status,
                          "contentType": response.headers.get("content-type"),
                          "contentLength": response.headers.get("content-length"),
                          "csp": response.headers.get("content-security-policy"),
                          "finalURL": response.geturl(),
                          "body": body,
                      }
              except urllib.error.HTTPError as error:
                  return {
                      "status": error.code,
                      "contentType": error.headers.get("content-type"),
                      "contentLength": error.headers.get("content-length"),
                      "csp": error.headers.get("content-security-policy"),
                      "finalURL": error.geturl(),
                      "body": error.read(),
                  }
              except Exception as error:
                  return {"error": repr(error), "body": b""}

          def sanitized(url):
              parts = urllib.parse.urlsplit(url)
              return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, "", ""))

          media_response = request(
              PAYLOAD + "/api/media?limit=20&depth=0",
              accept="application/json",
          )
          products_response = request(
              PAYLOAD + "/api/products?limit=20&depth=2",
              accept="application/json",
          )
          media_payload = json.loads(media_response["body"])
          products_payload = json.loads(products_response["body"])
          print("PAYLOAD_MEDIA_API", {k: v for k, v in media_response.items() if k != "body"})
          print("PAYLOAD_PRODUCTS_API", {k: v for k, v in products_response.items() if k != "body"})

          candidates = []
          for media in media_payload.get("docs", []):
              print("MEDIA", json.dumps({
                  "id": media.get("id"),
                  "filename": media.get("filename"),
                  "url": media.get("url"),
                  "sizes": {k: (v or {}).get("url") for k, v in (media.get("sizes") or {}).items()},
                  "status": media.get("_status"),
              }, ensure_ascii=False))
              for label, raw in [("original", media.get("url"))] + list((media.get("sizes") or {}).items()):
                  url = raw.get("url") if isinstance(raw, dict) else raw
                  if url:
                      candidates.append((f"media:{media.get('id')}:{label}", urllib.parse.urljoin(PAYLOAD + "/", url)))

          for product in products_payload.get("docs", []):
              print("PRODUCT", json.dumps({
                  "id": product.get("id"),
                  "title": product.get("title"),
                  "gallery": product.get("gallery"),
              }, ensure_ascii=False))

          print("PAYLOAD_FILE_PROBES")
          seen = set()
          for label, url in candidates:
              if url in seen:
                  continue
              seen.add(url)
              result = request(url, accept="image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8", referer=FRONTEND + "/", range_byte=True)
              print(label, json.dumps({
                  "url": sanitized(url),
                  **{k: v for k, v in result.items() if k not in ("body", "finalURL")},
                  "finalURL": sanitized(result.get("finalURL", url)),
                  "signature": result.get("body", b"")[:16].hex(),
              }, ensure_ascii=False))

          class ImgParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      self.images.append(dict(attrs))

          page = request(FRONTEND + "/", accept="text/html")
          print("FRONTEND_PAGE", json.dumps({k: v for k, v in page.items() if k != "body"}, ensure_ascii=False))
          html = page.get("body", b"").decode("utf-8", errors="replace")
          parser = ImgParser()
          parser.feed(html)
          target_alts = {"mmmmm", "mmmmmm", "qf", "ddd"}
          target_images = [image for image in parser.images if image.get("alt") in target_alts]
          print("RENDERED_TARGET_IMAGES", json.dumps(target_images, ensure_ascii=False))

          print("RENDERED_IMAGE_PROBES")
          rendered_urls = []
          for image in target_images:
              for field in ("src", "srcset"):
                  value = image.get(field)
                  if not value:
                      continue
                  if field == "srcset":
                      values = [part.strip().split(" ")[0] for part in value.split(",")]
                  else:
                      values = [value]
                  for raw in values:
                      rendered_urls.append(urllib.parse.urljoin(FRONTEND + "/", raw))
          for url in dict.fromkeys(rendered_urls):
              result = request(url, accept="image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8", referer=FRONTEND + "/", range_byte=True)
              print(json.dumps({
                  "url": sanitized(url),
                  **{k: v for k, v in result.items() if k not in ("body", "finalURL")},
                  "finalURL": sanitized(result.get("finalURL", url)),
                  "signature": result.get("body", b"")[:16].hex(),
              }, ensure_ascii=False))
          PY
