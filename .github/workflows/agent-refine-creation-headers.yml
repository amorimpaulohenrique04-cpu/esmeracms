name: Apply creation header refinements

on:
  push:
    branches:
      - agent/create-dialogs-responsive-20260806

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-dialogs-responsive-20260806
          fetch-depth: 0

      - name: Apply refinements
        run: |
          python scripts/agent_refine_creation_headers.py
          git diff --check

      - name: Commit refinements
        run: |
          rm scripts/agent_refine_creation_headers.py
          rm .github/workflows/agent-refine-creation-headers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): refine creation actions across breakpoints"
          git push origin HEAD:agent/create-dialogs-responsive-20260806
